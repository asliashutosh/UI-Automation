[pytest]
testpaths = tests
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
addopts =
    --tb=short
    -v
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    bug: marks tests that verify a specific bug
    e2e: marks end-to-end tests
    api: marks pure API tests (no browser)
    infra: marks infrastructure/cloud tests
    aws: marks tests requiring AWS credentials
    k8s: marks tests requiring Kubernetes access
    azure: marks tests requiring Azure credentials
